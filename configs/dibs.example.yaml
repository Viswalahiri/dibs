profile:
  github_login: your-github-login   # must match the account the token belongs to
  timezone: America/New_York        # decides when the reaper's daily pass runs

polling:
  default_interval_sec: 45
  min_interval_sec: 30
  max_concurrent: 4
  freshness_cutoff_min: 60      # older than this at first sight: recorded and dropped
  gap_warn_min: 15
  rate_limit_slow_at: 500
  rate_limit_pause_at: 100

slack:
  deliver_to: dm

reaper:
  expire_after_days: 14
  cadence_recompute_hour: 3
  lease_ttl_sec: 300
